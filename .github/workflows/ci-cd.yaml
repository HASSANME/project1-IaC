name: "CI test of bucket creation with encrypted TF data of SOPS"

on:
  push:
    branches: [ main ]
    paths: ["terraform/**"]


jobs:
  cache-tf:
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

    name: Cache Terraform providers
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Hashicorp - Terraform setup
          uses: hashicorp/setup-terraform@v3.1.2

        - name: Create Plugin Cache Directory
          run: mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache

        - name: Cache Terraform Providers
          uses: actions/cache@v4
          with:
            path: ${{ github.workspace }}/.terraform.d/plugin-cache
            key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
            restore-keys: |
              ${{ runner.os }}-terraform-

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4.0.4
        with:
          node-version: 20

      - name: Hashicorp - Terraform setup
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Cache Terraform providers
        uses: terraform-cache/terraform-cache@v1

      - name: Configure AWS Credentials for github actions
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          audience: sts.amazonaws.com
          aws-region: ${{secrets.AWS_REGION}}
          role-to-assume: ${{secrets.ROLE_TO_ASSUME}} 

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: |
          terraform fmt -recursive
          terraform validate
        continue-on-error: false

      - name: Terraform Plan
        run: terraform plan

  deploy:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4.0.4
        with:
          node-version: 20

      - name: Configure AWS Credentials for github actions
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          audience: sts.amazonaws.com
          aws-region: ${{secrets.AWS_REGION}}
          role-to-assume: ${{secrets.ROLE_TO_ASSUME}}

      - name: Deploy to AWS
        run: |
          terraform init
          terraform destroy -auto-approve
