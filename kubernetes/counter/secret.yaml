apiVersion: v1
kind: Secret
metadata:
  name: counter-secret
  labels:
    app: counter
type: Opaque
stringData:
  PG_URL: "postgres://appuser:ChangeMeToAStrongPassword!@postgres:5432/appdb"
  PG_DSN_URL: "host=postgres user=appuser password=ChangeMeToAStrongPassword! dbname=appdb sslmode=disable"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
